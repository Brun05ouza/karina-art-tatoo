name: Manter backend acordado

# O Render (plano gratuito) hiberna o serviço depois de ~15 min sem
# tráfego, e a primeira requisição depois disso demora 30-50s pra acordar
# — isso é o que fazia o site mostrar o conteúdo padrão embutido no código
# por um tempo, em vez do conteúdo real do Neon, pra quem chegava com o
# backend dormindo. Esse ping a cada 10 min mantém o serviço sempre
# acordado, sem custo (só usa minutos do GitHub Actions, que é de graça
# pra esse volume).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /health do backend
        run: |
          curl -fsS --max-time 55 "https://karina-art-tatoo.onrender.com/health" \
            && echo "Backend respondeu normalmente." \
            || echo "Sem resposta a tempo — provável cold start em andamento, não é falha do workflow."
